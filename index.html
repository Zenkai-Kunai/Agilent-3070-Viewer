<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agilent Board Graphics Viewer (ICT 3070)</title>
    <!-- JSZip CDN with cross-origin safeguards for GitHub Pages -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <style>
        * { box-sizing: border-box; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #c0c0c0; color: #000; font-size: 11px; padding: 4px; user-select: none; }
        
        /* Agilent Classic UI Layout */
        .window { border: 2px solid #ffffff; border-right-color: #404040; border-bottom-color: #404040; background: #c0c0c0; padding: 4px; }
        .menubar { background: #000080; color: white; padding: 2px 6px; font-weight: bold; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
        .menubar-file { cursor: pointer; text-decoration: underline; background: #c0c0c0; color: black; border: 1px solid #808080; padding: 1px 6px; }
        
        .top-panel { display: flex; gap: 6px; margin-bottom: 4px; }
        .notes-box { flex: 2; border: 1px solid #808080; background: #e0e0e0; padding: 4px; }
        .notes-title { font-weight: bold; margin-bottom: 2px; }
        #notes-content { width: 100%; height: 85px; background: #ffffff; border: 1px solid #707070; font-family: monospace; font-size: 11px; padding: 4px; overflow-y: auto; white-space: pre-wrap; }
        
        .features-box { flex: 1.5; border: 1px solid #808080; background: #c0c0c0; padding: 4px; display: grid; grid-template-columns: 1fr 40px 40px; align-items: center; gap: 2px; }
        .features-box header { font-weight: bold; grid-column: 1 / -1; margin-bottom: 2px; }
        .features-box label { font-size: 10px; }
        
        .controls-box { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 2px; align-content: start; }
        button { background: #c0c0c0; border: 2px solid #ffffff; border-right-color: #404040; border-bottom-color: #404040; padding: 3px; font-size: 10px; font-weight: bold; cursor: pointer; }
        button:active { border: 2px solid #404040; border-right-color: #ffffff; border-bottom-color: #ffffff; }

        .main-workspace { display: flex; gap: 4px; height: calc(100vh - 155px); }
        .no-xy-sidebar { width: 160px; background: #000000; border: 1px solid #707070; color: #00ff00; font-family: monospace; padding: 4px; display: flex; flex-direction: column; }
        .no-xy-sidebar header { color: #ffffff; font-family: sans-serif; font-size: 10px; font-weight: bold; text-align: center; margin-bottom: 4px; border-bottom: 1px solid #404040; padding-bottom: 2px; }
        #no-xy-list { flex: 1; overflow-y: auto; font-size: 10px; }
        
        .canvas-container { flex: 1; display: flex; flex-direction: column; background: #000; border: 1px solid #707070; position: relative; }
        .canvas-header { background: #800040; color: #ffffff; text-align: center; font-weight: bold; padding: 2px; font-size: 11px; }
        canvas { flex: 1; width: 100%; height: 100%; cursor: crosshair; display: block; }
        
        #file-input { display: none; }
    </style>
</head>
<body>

<div class="window">
    <div class="menubar">
        <span>Agilent Board Graphics Viewer (HTML5 Web Edition)</span>
        <label for="file-input" class="menubar-file">Open Board or ZIP File...</label>
        <input type="file" id="file-input" accept=".zip, .board, application/zip, application/x-zip-compressed, *" />
    </div>

    <div class="top-panel">
        <div class="notes-box">
            <div class="notes-title">Status: <span id="status-text" style="color: green;">Ready</span></div>
            <div id="notes-content">Select or open an Agilent 'board' or ZIP file to begin rendering...</div>
        </div>

        <div class="features-box">
            <header>Features Shown:</header>
            <label><input type="checkbox" id="chk-outlines" checked> Outlines</label>
            <span style="text-align:center; font-weight:bold;">Bottom</span>
            <span style="text-align:center; font-weight:bold;">Top</span>

            <label>X-Y Locations:</label>
            <input type="checkbox" id="chk-bot-xy" checked style="justify-self: center;">
            <input type="checkbox" id="chk-top-xy" checked style="justify-self: center;">

            <label>Device Outlines:</label>
            <input type="checkbox" id="chk-bot-dev" checked style="justify-self: center;">
            <input type="checkbox" id="chk-top-dev" checked style="justify-self: center;">
        </div>

        <div class="controls-box">
            <button id="btn-full">Full View</button>
            <button id="btn-redraw">Redraw</button>
            <button id="btn-zoomin">Zoom In</button>
            <button id="btn-zoomout">Zoom Out</button>
        </div>
    </div>

    <div class="main-workspace">
        <div class="no-xy-sidebar">
            <header>Devices with<br>no X-Y data:</header>
            <div id="no-xy-list"></div>
        </div>

        <div class="canvas-container">
            <div class="canvas-header">Detailed View</div>
            <canvas id="boardCanvas"></canvas>
        </div>
    </div>
</div>

<script>
    let canvas, ctx, notesEl, statusEl;

    // Dataset Containers
    let boardOutlines = [];
    let devices = {};
    let pins = [];
    let noXyDevices = [];

    // Viewport State
    let scale = 0.05;
    let offsetX = 100;
    let offsetY = 100;
    let isPanning = false;
    let startX, startY;

    function resizeCanvas() {
        if (!canvas) return;
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight - 20;
        redraw();
    }

    window.addEventListener('DOMContentLoaded', () => {
        canvas = document.getElementById('boardCanvas');
        ctx = canvas.getContext('2d');
        notesEl = document.getElementById('notes-content');
        statusEl = document.getElementById('status-text');

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const fileInput = document.getElementById('file-input');
        
        fileInput.addEventListener('change', async function(e) {
            const file = e.target.files[0];
            // Reset input value so selecting the same file again triggers change event
            e.target.value = '';

            if (!file) return;

            console.log("Processing File:", file.name);
            const fileName = file.name.toLowerCase();

            if (fileName.endsWith('.zip')) {
                if (typeof JSZip === 'undefined') {
                    alert('JSZip library is blocked or not loaded. Check internet/CDN access.');
                    statusEl.innerText = 'Error: JSZip missing';
                    return;
                }

                statusEl.innerText = `Extracting '${file.name}'...`;
                try {
                    const zip = await JSZip.loadAsync(file);
                    const fileList = Object.keys(zip.files).filter(name => !zip.files[name].dir);

                    console.log("ZIP Contents:", fileList);
                    notesEl.innerText = `ZIP contents (${fileList.length} files):\n` + fileList.join('\n') + '\n\nSearching for board file...';

                    // Priority search ignoring parent directory paths
                    let targetFileName = fileList.find(name => {
                        const cleanName = name.split('/').pop().toLowerCase();
                        return cleanName === 'board' || cleanName.endsWith('.board') || cleanName.includes('board');
                    });

                    // Fallback search to any valid text file inside
                    if (!targetFileName) {
                        targetFileName = fileList.find(name => {
                            const cleanName = name.split('/').pop();
                            return !cleanName.startsWith('.') && !name.includes('__MACOSX');
                        });
                    }

                    if (!targetFileName) {
                        notesEl.innerText += '\n[ERROR] No suitable target file found inside ZIP.';
                        statusEl.innerText = 'ZIP Parsing Error';
                        return;
                    }

                    notesEl.innerText += `\nSelected File: '${targetFileName}'`;
                    const text = await zip.file(targetFileName).async('string');
                    parseAgilentBoard(text);
                    statusEl.innerText = `Loaded '${targetFileName}' from '${file.name}'`;
                    zoomFull();
                } catch (err) {
                    console.error("ZIP Error:", err);
                    notesEl.innerText = `Error reading ZIP archive:\n${err.message}`;
                    statusEl.innerText = 'ZIP Read Failed';
                }
            } else {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    parseAgilentBoard(evt.target.result);
                    statusEl.innerText = `Loaded '${file.name}'`;
                    zoomFull();
                };
                reader.readAsText(file);
            }
        });

        // Event Control Registrations
        document.getElementById('btn-full').addEventListener('click', zoomFull);
        document.getElementById('btn-redraw').addEventListener('click', redraw);
        document.getElementById('btn-zoomin').addEventListener('click', () => { scale *= 1.25; redraw(); });
        document.getElementById('btn-zoomout').addEventListener('click', () => { scale /= 1.25; redraw(); });

        ['chk-outlines', 'chk-bot-xy', 'chk-top-xy', 'chk-bot-dev', 'chk-top-dev'].forEach(id => {
            document.getElementById(id).addEventListener('change', redraw);
        });

        canvas.addEventListener('mousedown', e => { if (e.button === 2 || e.button === 0) { isPanning = true; startX = e.clientX - offsetX; startY = e.clientY - offsetY; } });
        canvas.addEventListener('mousemove', e => { if (isPanning) { offsetX = e.clientX - startX; offsetY = e.clientY - startY; redraw(); } });
        canvas.addEventListener('mouseup', () => isPanning = false);
        canvas.addEventListener('contextmenu', e => e.preventDefault());

        canvas.addEventListener('wheel', e => {
            e.preventDefault();
            const zoomFactor = e.deltaY < 0 ? 1.15 : 0.85;
            scale *= zoomFactor;
            redraw();
        });
    });

    function parseAgilentBoard(text) {
        boardOutlines = [];
        devices = {};
        pins = [];
        noXyDevices = [];

        const lines = text.split(/\r?\n/);
        let inBoundary = false;
        let currentBoundary = [];

        // 1. Line-by-Line Outline Parsing
        for (let i = 0; i < lines.length; i++) {
            const line = lines[i].trim();
            if (line.toLowerCase().startsWith('boundary')) {
                inBoundary = true;
                const inlineNums = line.replace(/boundary/i, '').trim().split(/\s+/).map(Number).filter(n => !isNaN(n));
                if (inlineNums.length >= 2) currentBoundary.push(...inlineNums);
                continue;
            }
            if (inBoundary) {
                if (line.toLowerCase().startsWith('device') || line.toLowerCase().startsWith('node') || line === '}') {
                    if (currentBoundary.length >= 4) boardOutlines.push(currentBoundary);
                    currentBoundary = [];
                    inBoundary = false;
                } else {
                    const nums = line.split(/\s+/).map(Number).filter(n => !isNaN(n));
                    if (nums.length > 0) currentBoundary.push(...nums);
                }
            }
        }
        if (currentBoundary.length >= 4) boardOutlines.push(currentBoundary);

        // 2. Flexible Device & Pin Parsing
        const devRegex = /device\s+["']?([^"'\s]+)["']?\s*\{([^}]+)\}/gi;
        let match;
        while ((match = devRegex.exec(text)) !== null) {
            const devId = match[1];
            const block = match[2];
            const side = /side\s+bottom/i.test(block) ? 'B' : 'T';

            const pinRegex = /pin\s+["']?([^"'\s]+)["']?\s+(-?\d+(?:\.\d+)?)\s+(-?\d+(?:\.\d+)?)\s+([^\r\n]+)/gi;
            let pMatch;
            let devPins = [];

            while ((pMatch = pinRegex.exec(block)) !== null) {
                const pInfo = {
                    id: pMatch[1],
                    x: parseFloat(pMatch[2]),
                    y: parseFloat(pMatch[3]),
                    side: side,
                    node: pMatch[4].trim(),
                    dev: devId
                };
                pins.push(pInfo);
                devPins.push(pInfo);
            }

            if (devPins.length > 0) {
                const xs = devPins.map(p => p.x);
                const ys = devPins.map(p => p.y);
                devices[devId] = {
                    side: side,
                    bbox: [Math.min(...xs) - 800, Math.min(...ys) - 800, Math.max(...xs) + 800, Math.max(...ys) + 800],
                    pins: devPins
                };
            } else {
                noXyDevices.push(devId);
            }
        }

        // Diagnostic summary output
        notesEl.innerText += `\n\n--- PARSE SUMMARY ---\nOutlines Found: ${boardOutlines.length}\nDevices Found: ${Object.keys(devices).length}\nPins Processed: ${pins.length}\nNo-XY Devices: ${noXyDevices.length}`;

        const listContainer = document.getElementById('no-xy-list');
        listContainer.innerHTML = noXyDevices.map(d => `<div>${d}</div>`).join('');
    }

    function worldToScreen(wx, wy) {
        const sx = (wx * scale) + offsetX;
        const sy = canvas.height - ((wy * scale) + offsetY);
        return { x: sx, y: sy };
    }

    function screenToWorld(sx, sy) {
        const wx = (sx - offsetX) / scale;
        const wy = (canvas.height - sy - offsetY) / scale;
        return { x: wx, y: wy };
    }

    function redraw() {
        if (!ctx) return;
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const showOutlines = document.getElementById('chk-outlines').checked;
        const showTopDev = document.getElementById('chk-top-dev').checked;
        const showBotDev = document.getElementById('chk-bot-dev').checked;
        const showTopXY = document.getElementById('chk-top-xy').checked;
        const showBotXY = document.getElementById('chk-bot-xy').checked;

        if (showOutlines) {
            ctx.strokeStyle = '#ff00ff';
            ctx.lineWidth = 1.5;
            boardOutlines.forEach(line => {
                ctx.beginPath();
                for (let i = 0; i < line.length - 1; i += 2) {
                    const p = worldToScreen(line[i], line[i+1]);
                    if (i === 0) ctx.moveTo(p.x, p.y);
                    else ctx.lineTo(p.x, p.y);
                }
                ctx.stroke();
            });
        }

        Object.keys(devices).forEach(devId => {
            const dev = devices[devId];
            if ((dev.side === 'T' && showTopDev) || (dev.side === 'B' && showBotDev)) {
                ctx.strokeStyle = dev.side === 'T' ? '#55ffff' : '#ffaa00';
                ctx.lineWidth = 1;
                const p1 = worldToScreen(dev.bbox[0], dev.bbox[1]);
                const p2 = worldToScreen(dev.bbox[2], dev.bbox[3]);
                ctx.strokeRect(p1.x, p1.y, p2.x - p1.x, p2.y - p1.y);
            }
        });

        pins.forEach(p => {
            if ((p.side === 'T' && showTopXY) || (p.side === 'B' && showBotXY)) {
                ctx.fillStyle = p.side === 'T' ? '#ffffff' : '#ffff00';
                const pt = worldToScreen(p.x, p.y);
                ctx.fillRect(pt.x - 1.5, pt.y - 1.5, 3, 3);
            }
        });
    }

    function zoomFull() {
        if (pins.length === 0) return;
        const xs = pins.map(p => p.x);
        const ys = pins.map(p => p.y);
        const minX = Math.min(...xs), maxX = Math.max(...xs);
        const minY = Math.min(...ys), maxY = Math.max(...ys);

        const bw = (maxX - minX) || 1;
        const bh = (maxY - minY) || 1;

        scale = Math.min(canvas.width / bw, canvas.height / bh) * 0.85;
        offsetX = (canvas.width - (bw * scale)) / 2 - (minX * scale);
        offsetY = (canvas.height - (bh * scale)) / 2 - (minY * scale);
        redraw();
    }
</script>
</body>
</html>
