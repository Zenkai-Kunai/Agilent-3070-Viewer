<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agilent Board_XY Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: #fff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            height: 95vh;
        }
        #controls {
            margin-bottom: 10px;
            background: #2d2d2d;
            padding: 10px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        #viewer-container {
            flex: 1;
            background-color: #000;
            border: 2px solid #444;
            position: relative;
            overflow: hidden;
            border-radius: 6px;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: crosshair;
        }
        .legend {
            display: flex;
            gap: 12px;
            font-size: 14px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .box {
            width: 12px;
            height: 12px;
            display: inline-block;
            border: 1px solid #fff;
        }
    </style>
</head>
<body>

    <h2>Agilent Board_XY Graphic Viewer</h2>
    
    <div id="controls">
        <input type="file" id="fileInput" accept=".txt,.xy,.board_xy,text/*">
        <div class="legend">
            <span class="legend-item"><span class="box" style="background: #ff007f;"></span> Board Outline</span>
            <span class="legend-item"><span class="box" style="background: #00ffff;"></span> Top Side</span>
            <span class="legend-item"><span class="box" style="background: #ffb700;"></span> Bottom Side</span>
        </div>
        <button onclick="resetZoom()">Reset Zoom</button>
    </div>

    <div id="viewer-container">
        <canvas id="boardCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('boardCanvas');
        const ctx = canvas.getContext('2d');
        const fileInput = document.getElementById('fileInput');

        let boardData = { outline: [], points: [] };
        let scale = 1;
        let panX = 0;
        let panY = 0;
        let isDragging = false;
        let startX, startY;

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            draw();
        }
        window.addEventListener('resize', resizeCanvas);

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                parseBoardXY(event.target.result);
                resetZoom();
            };
            reader.readAsText(file);
        });

        function parseBoardXY(text) {
            boardData = { outline: [], points: [] };
            const lines = text.split('\n');

            let inOutline = false;

            for (let rawLine of lines) {
                let line = rawLine.trim();
                if (!line || line.startsWith('!') || line.startsWith('//')) continue;

                // Detect Board Outline section
                if (line.includes('BOARD OUTLINE') || line.includes('OUTLINE')) {
                    inOutline = true;
                    continue;
                }

                if (inOutline) {
                    if (line.includes('END') || line.includes('NODE')) {
                        inOutline = false;
                    } else {
                        const coords = line.match(/(-?\d+)\s*,\s*(-?\d+)/);
                        if (coords) {
                            boardData.outline.push({ x: parseInt(coords[1]), y: parseInt(coords[2]) });
                        }
                    }
                }

                // Detect Node / Component Coordinates
                const nodeMatch = line.match(/(-?\d+)\s*,\s*(-?\d+)\s+([\w%\.]+)\s+(TOP|BOTTOM)/i);
                if (nodeMatch) {
                    boardData.points.push({
                        x: parseInt(nodeMatch[1]),
                        y: parseInt(nodeMatch[2]),
                        name: nodeMatch[3],
                        side: nodeMatch[4].toUpperCase()
                    });
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(panX, panY);
            ctx.scale(scale, scale);

            // Draw Board Outline (Pink)
            if (boardData.outline.length > 0) {
                ctx.strokeStyle = '#ff007f';
                ctx.lineWidth = 2 / scale;
                ctx.beginPath();
                ctx.moveTo(boardData.outline[0].x, -boardData.outline[0].y);
                for (let i = 1; i < boardData.outline.length; i++) {
                    ctx.lineTo(boardData.outline[i].x, -boardData.outline[i].y);
                }
                ctx.closePath();
                ctx.stroke();
            }

            // Draw Nodes / Pins (Cyan for TOP, Yellow/Orange for BOTTOM)
            const pointSize = Math.max(2, 8 / scale);
            for (let pt of boardData.points) {
                ctx.fillStyle = (pt.side === 'TOP') ? '#00ffff' : '#ffb700';
                ctx.fillRect(pt.x - pointSize / 2, -pt.y - pointSize / 2, pointSize, pointSize);
            }

            ctx.restore();
        }

        function resetZoom() {
            if (boardData.points.length === 0 && boardData.outline.length === 0) return;

            let allX = [...boardData.outline.map(p => p.x), ...boardData.points.map(p => p.x)];
            let allY = [...boardData.outline.map(p => -p.y), ...boardData.points.map(p => -p.y)];

            let minX = Math.min(...allX);
            let maxX = Math.max(...allX);
            let minY = Math.min(...allY);
            let maxY = Math.max(...allY);

            let width = maxX - minX || 1;
            let height = maxY - minY || 1;

            scale = Math.min(canvas.width / width, canvas.height / height) * 0.8;
            panX = (canvas.width - width * scale) / 2 - minX * scale;
            panY = (canvas.height - height * scale) / 2 - minY * scale;

            draw();
        }

        // Pan and Zoom Controls
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - panX;
            startY = e.clientY - panY;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                panX = e.clientX - startX;
                panY = e.clientY - startY;
                draw();
            }
        });

        canvas.addEventListener('mouseup', () => isDragging = false);

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = e.deltaY < 0 ? 1.15 : 0.85;
            scale *= zoomFactor;
            draw();
        });

        resizeCanvas();
    </script>
</body>
</html>
