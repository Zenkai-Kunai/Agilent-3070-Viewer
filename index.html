<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agilent 3070 Board Graphic Viewer</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --panel-bg: rgba(30, 41, 59, 0.85);
      --border-color: #334155;
      --accent-color: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --top-color: #38bdf8;
      --bottom-color: #f43f5e;
      --outline-color: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar Navigation */
    #sidebar {
      width: 320px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 20px;
      z-index: 10;
      box-shadow: 4px 0 24px rgba(0,0,0,0.3);
      overflow-y: auto;
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--accent-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-box {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px;
    }

    .section-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 12px;
      font-weight: 600;
    }

    /* File Input Styling */
    .file-input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label.file-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      background: #1e293b;
      border: 1px dashed var(--accent-color);
      border-radius: 6px;
      color: var(--accent-color);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    label.file-btn:hover {
      background: rgba(56, 189, 248, 0.1);
    }

    input[type="file"] {
      display: none;
    }

    .file-status {
      font-size: 0.75rem;
      color: var(--text-muted);
      word-break: break-all;
    }

    /* Toggle Buttons */
    .view-toggle-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn {
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      background: #1e293b;
      color: var(--text-main);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .btn:hover {
      border-color: var(--accent-color);
    }

    .btn.active {
      background: var(--accent-color);
      color: #0f172a;
      border-color: var(--accent-color);
      font-weight: 700;
    }

    /* Feature Checkboxes */
    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-main);
    }

    .checkbox-item input {
      accent-color: var(--accent-color);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    /* Overview Map */
    #overview-container {
      position: relative;
      width: 100%;
      height: 180px;
      background: #090d16;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      overflow: hidden;
    }

    #overviewCanvas {
      width: 100%;
      height: 100%;
    }

    /* Main Viewer Viewport */
    #viewport {
      flex: 1;
      position: relative;
      background-color: #050811;
      cursor: grab;
      overflow: hidden;
    }

    #viewport:active {
      cursor: grabbing;
    }

    #mainCanvas {
      position: absolute;
      top: 0;
      left: 0;
    }

    /* Floating Stats Bar */
    .stats-bar {
      position: absolute;
      bottom: 16px;
      right: 16px;
      background: var(--panel-bg);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      gap: 16px;
      pointer-events: none;
    }

    .stats-bar span strong {
      color: var(--text-main);
    }

    /* Pin Info Modal / Overlay Box */
    #infoBox {
      position: absolute;
      top: 20px;
      left: 20px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      width: 320px;
      display: none;
      z-index: 20;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    #infoBox h3 {
      font-size: 0.95rem;
      color: var(--accent-color);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #infoBox p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    #infoBox p span {
      color: var(--text-main);
      font-weight: 600;
    }

    #infoBox .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.2rem;
      line-height: 1;
    }

    #infoBox .close-btn:hover {
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <!-- Sidebar Controls -->
  <div id="sidebar">
    <div class="brand-title">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="2" width="20" height="20" rx="4"></rect>
        <circle cx="8" cy="8" r="2"></circle>
        <circle cx="16" cy="16" r="2"></circle>
        <path d="M8 10v4h8"></path>
      </svg>
      Agilent 3070 Viewer
    </div>

    <!-- File Input Section -->
    <div class="section-box">
      <div class="section-title">Load Board File(s)</div>
      <div class="file-input-group">
        <label class="file-btn">
          Select Board / XY File
          <input type="file" id="fileInput1" accept=".file,.xy,.txt,*">
        </label>
        <div class="file-status" id="file1Status">No file selected</div>

        <!-- Wirelist File Button -->
        <label class="file-btn" style="margin-top: 6px;">
          Select Wirelist File
          <input type="file" id="fileInput2" accept=".file,.wire,.txt,*">
        </label>
        <div class="file-status" id="file2Status">No file selected</div>
      </div>
    </div>

    <!-- View Mode Toggle -->
    <div class="section-box">
      <div class="section-title">Board Side View</div>
      <div class="view-toggle-group">
        <button class="btn active" id="btnTopView">Top Side</button>
        <button class="btn" id="btnBottomView">Bottom Side</button>
      </div>
    </div>

    <!-- Feature Display Filters -->
    <div class="section-box">
      <div class="section-title">Feature Visibility</div>
      <div class="checkbox-group">
        <label class="checkbox-item">
          <span>Top Pins</span>
          <input type="checkbox" id="chkTopPins" checked>
        </label>
        <label class="checkbox-item">
          <span>Bottom Pins</span>
          <input type="checkbox" id="chkBottomPins" checked>
        </label>
        <hr style="border-color: var(--border-color); margin: 2px 0;">
        <label class="checkbox-item">
          <span>Top Component Outline</span>
          <input type="checkbox" id="chkTopComp" checked>
        </label>
        <label class="checkbox-item">
          <span>Bottom Component Outline</span>
          <input type="checkbox" id="chkBottomComp" checked>
        </label>
        <hr style="border-color: var(--border-color); margin: 2px 0;">
        <label class="checkbox-item">
          <span>Board Outline</span>
          <input type="checkbox" id="chkBoardOutline" checked>
        </label>
      </div>
    </div>

    <!-- Overview Minimap -->
    <div class="section-box">
      <div class="section-title">Overview Map</div>
      <div id="overview-container">
        <canvas id="overviewCanvas"></canvas>
      </div>
    </div>
  </div>

  <!-- Main Viewport Canvas -->
  <div id="viewport">
    <canvas id="mainCanvas"></canvas>
    
    <!-- Pin Info Pop-up Box -->
    <div id="infoBox">
      <h3><span>Pin Information</span> <button class="close-btn" id="closeInfoBox">&times;</button></h3>
      <p>Component: <span id="infoComp">-</span></p>
      <p>Pin Number: <span id="infoPinNum">-</span></p>
      <p>Node Name: <span id="infoNode">-</span></p>
      <p>Side: <span id="infoSide">-</span></p>
      <p>Coordinates: <span id="infoCoords">-</span></p>
      <p id="infoConnectionsContainer" style="margin-top: 8px; border-top: 1px solid var(--border-color); padding-top: 8px;">
        <strong>Connected Pins on Node:</strong><br>
        <span id="infoConnections" style="font-size: 0.75rem; color: var(--text-main); word-break: break-all;">-</span>
      </p>
    </div>

    <div class="stats-bar">
      <div>Nodes: <strong id="statNodes">0</strong></div>
      <div>Components/Pins: <strong id="statPins">0</strong></div>
      <div>Zoom: <strong id="statZoom">100%</strong></div>
    </div>
  </div>

  <script>
    const state = {
      file1Text: '',
      file2Text: '',
      nodes: [],
      boardOutline: [],
      currentSide: 'TOP',
      visibility: {
        topPins: true,
        bottomPins: true,
        topComp: true,
        bottomComp: true,
        boardOutline: true
      },
      bounds: { minX: 0, maxX: 1000, minY: 0, maxY: 1000 },
      transform: { x: 0, y: 0, scale: 1 },
      isDragging: false,
      dragStart: { x: 0, y: 0 },
      selectedPin: null,
      highlightedNode: null
    };

    let dragStartPos = { x: 0, y: 0 };

    const viewport = document.getElementById('viewport');
    const mainCanvas = document.getElementById('mainCanvas');
    const mainCtx = mainCanvas.getContext('2d');
    const overviewCanvas = document.getElementById('overviewCanvas');
    const overviewCtx = overviewCanvas.getContext('2d');

    function resizeCanvas() {
      mainCanvas.width = viewport.clientWidth;
      mainCanvas.height = viewport.clientHeight;
      overviewCanvas.width = overviewCanvas.parentElement.clientWidth;
      overviewCanvas.height = overviewCanvas.parentElement.clientHeight;
      render();
    }
    window.addEventListener('resize', resizeCanvas);

    function parseBoardXY(text) {
      const nodes = [];
      const outline = [];
      const lines = text.split('\n');
      let currentNode = null;
      let parsingOutline = false;

      for (let line of lines) {
        let trimmed = line.trim();
        if (!trimmed) continue;

        if (/^(BOARD_)?OUTLINE/i.test(trimmed)) {
          parsingOutline = true;
          currentNode = null;
          const parts = trimmed.split(/\s+/);
          if (parts.length > 1) {
            const rest = parts.slice(1).join(' ');
            const matches = rest.matchAll(/(-?\d+),\s*(-?\d+)/g);
            for (const m of matches) {
              outline.push({ x: parseInt(m[1], 10), y: parseInt(m[2], 10) });
            }
          }
          continue;
        }

        if (trimmed.startsWith('NODE')) {
          parsingOutline = false;
          const parts = trimmed.split(/\s+/);
          currentNode = {
            name: parts[1] || 'UNKNOWN',
            pins: []
          };
          nodes.push(currentNode);
          continue;
        }

        if (parsingOutline) {
          if (trimmed.includes(';') || trimmed.startsWith('NODE')) {
            parsingOutline = false;
          }
          const coordMatch = trimmed.match(/(-?\d+),\s*(-?\d+)/);
          if (coordMatch) {
            outline.push({ x: parseInt(coordMatch[1], 10), y: parseInt(coordMatch[2], 10) });
          }
        } else if (currentNode) {
          const coordMatch = trimmed.match(/(-?\d+),\s*(-?\d+)\s*([^;]*)/);
          if (coordMatch) {
            const x = parseInt(coordMatch[1], 10);
            const y = parseInt(coordMatch[2], 10);
            const meta = coordMatch[3] || '';
            const isTop = meta.includes('TOP');
            const isBottom = meta.includes('BOTTOM');
            
            const compMatch = meta.match(/([A-Z0-9]+\.[A-Z0-9]+)/i);
            const compRef = compMatch ? compMatch[1] : '';
            const partsComp = compRef.split('.');

            currentNode.pins.push({
              x,
              y,
              side: isTop ? 'TOP' : (isBottom ? 'BOTTOM' : 'BOTH'),
              ref: compRef,
              component: partsComp[0] || compRef,
              pinNum: partsComp[1] || '',
              rawMeta: meta,
              nodeName: currentNode.name
            });
          }
        }
      }
      return { nodes, outline };
    }

    function calculateBounds(nodes, outline = []) {
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      let pinCount = 0;

      nodes.forEach(node => {
        node.pins.forEach(pin => {
          pinCount++;
          if (pin.x < minX) minX = pin.x;
          if (pin.x > maxX) maxX = pin.x;
          if (pin.y < minY) minY = pin.y;
          if (pin.y > maxY) maxY = pin.y;
        });
      });

      if (outline && outline.length > 0) {
        outline.forEach(pt => {
          if (pt.x < minX) minX = pt.x;
          if (pt.x > maxX) maxX = pt.x;
          if (pt.y < minY) minY = pt.y;
          if (pt.y > maxY) maxY = pt.y;
        });
      }

      if (minX === Infinity) {
        minX = 0; maxX = 50000; minY = -10000; maxY = 30000;
      }

      state.bounds = { minX, maxX, minY, maxY };
      document.getElementById('statNodes').innerText = nodes.length;
      document.getElementById('statPins').innerText = pinCount;

      resetView();
    }

    function resetView() {
      const margin = 40;
      const boardWidth = state.bounds.maxX - state.bounds.minX;
      const boardHeight = state.bounds.maxY - state.bounds.minY;

      if (boardWidth <= 0 || boardHeight <= 0) return;

      const scaleX = (mainCanvas.width - margin * 2) / boardWidth;
      const scaleY = (mainCanvas.height - margin * 2) / boardHeight;
      state.transform.scale = Math.min(scaleX, scaleY);

      state.transform.x = margin + (mainCanvas.width - margin * 2 - boardWidth * state.transform.scale) / 2 - state.bounds.minX * state.transform.scale;
      state.transform.y = margin + (mainCanvas.height - margin * 2 - boardHeight * state.transform.scale) / 2 - state.bounds.minY * state.transform.scale;
      
      render();
    }

    function processFiles() {
      const combinedText = state.file1Text + '\n' + state.file2Text;
      const parsedData = parseBoardXY(combinedText);
      state.nodes = parsedData.nodes;
      state.boardOutline = parsedData.outline;
      calculateBounds(state.nodes, state.boardOutline);
    }

    document.getElementById('fileInput1').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      document.getElementById('file1Status').innerText = file.name;
      const reader = new FileReader();
      reader.onload = (evt) => {
        state.file1Text = evt.target.result;
        processFiles();
      };
      reader.readAsText(file);
    });

    document.getElementById('fileInput2').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      document.getElementById('file2Status').innerText = file.name;
      const reader = new FileReader();
      reader.onload = (evt) => {
        state.file2Text = evt.target.result;
        processFiles();
      };
      reader.readAsText(file);
    });

    function render() {
      mainCtx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
      document.getElementById('statZoom').innerText = Math.round(state.transform.scale * 10000) / 100 + '%';

      drawGrid(mainCtx, mainCanvas.width, mainCanvas.height);

      mainCtx.save();
      mainCtx.translate(state.transform.x, state.transform.y);

      const flipY = (state.currentSide === 'BOTTOM') ? 1 : -1;
      if (state.currentSide === 'BOTTOM') {
        const centerY = (state.bounds.minY + state.bounds.maxY) / 2;
        mainCtx.translate(0, centerY * state.transform.scale);
        mainCtx.scale(state.transform.scale, flipY * state.transform.scale);
        mainCtx.translate(0, -centerY);
      } else {
        mainCtx.scale(state.transform.scale, flipY * state.transform.scale);
      }

      if (state.visibility.boardOutline) {
        mainCtx.strokeStyle = '#10b981';
        mainCtx.lineWidth = 2 / state.transform.scale;
        
        if (state.boardOutline && state.boardOutline.length > 0) {
          mainCtx.beginPath();
          mainCtx.moveTo(state.boardOutline[0].x, state.boardOutline[0].y);
          for (let i = 1; i < state.boardOutline.length; i++) {
            mainCtx.lineTo(state.boardOutline[i].x, state.boardOutline[i].y);
          }
          mainCtx.closePath();
          mainCtx.stroke();
        } else {
          const b = state.bounds;
          mainCtx.strokeRect(b.minX - 500, b.minY - 500, (b.maxX - b.minX) + 1000, (b.maxY - b.minY) + 1000);
        }
      }

      if (state.highlightedNode) {
        mainCtx.strokeStyle = '#f59e0b';
        mainCtx.lineWidth = 2.5 / state.transform.scale;
        const pins = state.highlightedNode.pins;
        if (pins.length > 1) {
          mainCtx.beginPath();
          for (let i = 0; i < pins.length; i++) {
            for (let j = i + 1; j < pins.length; j++) {
              mainCtx.moveTo(pins[i].x, pins[i].y);
              mainCtx.lineTo(pins[j].x, pins[j].y);
            }
          }
          mainCtx.stroke();
        }
      }

      state.nodes.forEach(node => {
        node.pins.forEach(pin => {
          const isTopPin = pin.side === 'TOP' || pin.side === 'BOTH';
          const isBottomPin = pin.side === 'BOTTOM' || pin.side === 'BOTH';

          const showTop = isTopPin && state.visibility.topPins;
          const showBottom = isBottomPin && state.visibility.bottomPins;

          if (!showTop && !showBottom) return;

          const isSelected = (state.selectedPin === pin);
          const isConnected = (state.highlightedNode === node);
          const pinRadius = (isSelected || isConnected) ? 350 : 180;

          if (showTop && showBottom) {
            mainCtx.beginPath();
            mainCtx.arc(pin.x, pin.y, pinRadius, Math.PI / 2, Math.PI * 1.5, false);
            mainCtx.fillStyle = isConnected ? '#f59e0b' : '#38bdf8';
            mainCtx.fill();

            mainCtx.beginPath();
            mainCtx.arc(pin.x, pin.y, pinRadius, Math.PI * 1.5, Math.PI / 2, false);
            mainCtx.fillStyle = isConnected ? '#f59e0b' : '#f43f5e';
            mainCtx.fill();
          } else if (showTop) {
            mainCtx.beginPath();
            mainCtx.arc(pin.x, pin.y, pinRadius, 0, Math.PI * 2);
            mainCtx.fillStyle = isConnected ? '#f59e0b' : '#38bdf8';
            mainCtx.fill();
          } else if (showBottom) {
            mainCtx.beginPath();
            mainCtx.arc(pin.x, pin.y, pinRadius, 0, Math.PI * 2);
            mainCtx.fillStyle = isConnected ? '#f59e0b' : '#f43f5e';
            mainCtx.fill();
          }

          if (isSelected) {
            mainCtx.strokeStyle = '#ffffff';
            mainCtx.lineWidth = 4 / state.transform.scale;
            mainCtx.beginPath();
            mainCtx.arc(pin.x, pin.y, 400, 0, Math.PI * 2);
            mainCtx.stroke();
          }

          if (pin.ref) {
            const showTopComp = isTopPin && state.visibility.topComp;
            const showBottomComp = isBottomPin && state.visibility.bottomComp;

            if (showTopComp || showBottomComp) {
              mainCtx.strokeStyle = showTopComp ? 'rgba(56, 189, 248, 0.4)' : 'rgba(244, 63, 94, 0.4)';
              mainCtx.lineWidth = 1 / state.transform.scale;
              mainCtx.strokeRect(pin.x - 200, pin.y - 200, 400, 400);
            }
          }
        });
      });

      mainCtx.restore();
      renderOverview();
    }

    function drawGrid(ctx, width, height) {
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 1;
      const gridSize = 40;
      ctx.beginPath();
      for (let x = 0; x < width; x += gridSize) {
        ctx.moveTo(x, 0); ctx.lineTo(x, height);
      }
      for (let y = 0; y < height; y += gridSize) {
        ctx.moveTo(0, y); ctx.lineTo(width, y);
      }
      ctx.stroke();
    }

    function renderOverview() {
      const w = overviewCanvas.width;
      const h = overviewCanvas.height;
      overviewCtx.clearRect(0, 0, w, h);

      const b = state.bounds;
      const boardW = b.maxX - b.minX;
      const boardH = b.maxY - b.minY;

      if (boardW <= 0 || boardH <= 0) return;

      const pad = 0.05;
      const scale = Math.min((w * (1 - pad)) / boardW, (h * (1 - pad)) / boardH);
      const offsetX = (w - boardW * scale) / 2;
      const offsetY = (h - boardH * scale) / 2;

      function worldToMinimap(wx, wy) {
        const mx = offsetX + (wx - b.minX) * scale;
        const my = h - (offsetY + (wy - b.minY) * scale);
        return { x: mx, y: my };
      }

      overviewCtx.strokeStyle = '#334155';
      if (state.boardOutline && state.boardOutline.length > 0) {
        overviewCtx.beginPath();
        for (let i = 0; i < state.boardOutline.length; i++) {
          const pt = worldToMinimap(state.boardOutline[i].x, state.boardOutline[i].y);
          if (i === 0) overviewCtx.moveTo(pt.x, pt.y);
          else overviewCtx.lineTo(pt.x, pt.y);
        }
        overviewCtx.closePath();
        overviewCtx.stroke();
      } else {
        overviewCtx.strokeRect(offsetX, offsetY, boardW * scale, boardH * scale);
      }

      overviewCtx.fillStyle = '#38bdf8';
      state.nodes.forEach(node => {
        node.pins.forEach(pin => {
          const pt = worldToMinimap(pin.x, pin.y);
          overviewCtx.fillRect(pt.x, pt.y, 1.5, 1.5);
        });
      });

      function screenToWorld(sx, sy) {
        const wx = (sx - state.transform.x) / state.transform.scale;
        let wy = (sy - state.transform.y) / state.transform.scale;
        if (state.currentSide === 'BOTTOM') {
          const centerY = (b.minY + b.maxY) / 2;
          wy = centerY - (wy - centerY);
        }
        return { x: wx, y: wy };
      }

      const tl = screenToWorld(0, 0);
      const br = screenToWorld(mainCanvas.width, mainCanvas.height);

      const vpMinX = Math.min(tl.x, br.x);
      const vpMaxX = Math.max(tl.x, br.x);
      const vpMinY = Math.min(tl.y, br.y);
      const vpMaxY = Math.max(tl.y, br.y);

      const mm1 = worldToMinimap(vpMinX, vpMaxY);
      const mm2 = worldToMinimap(vpMaxX, vpMinY);

      overviewCtx.strokeStyle = '#f59e0b';
      overviewCtx.lineWidth = 1.5;
      overviewCtx.strokeRect(mm1.x, mm1.y, mm2.x - mm1.x, mm2.y - mm1.y);
      overviewCtx.fillStyle = 'rgba(245, 158, 11, 0.15)';
      overviewCtx.fillRect(mm1.x, mm1.y, mm2.x - mm1.x, mm2.y - mm1.y);
    }

    // FIXED HIT TEST: Inverted transformation map aligned perfectly with render matrix
    function getPinAtMouse(clientX, clientY) {
      const rect = mainCanvas.getBoundingClientRect();
      const clickX = clientX - rect.left;
      const clickY = clientY - rect.top;

      let worldX = (clickX - state.transform.x) / state.transform.scale;
      let worldY = (clickY - state.transform.y) / state.transform.scale;
      
      if (state.currentSide === 'BOTTOM') {
        const centerY = (state.bounds.minY + state.bounds.maxY) / 2;
        worldY = centerY - (worldY - centerY);
      }

      let closestPin = null;
      let minDistance = 600 / state.transform.scale; // Generous hit radius for click ease

      state.nodes.forEach(node => {
        node.pins.forEach(pin => {
          const isTopPin = pin.side === 'TOP' || pin.side === 'BOTH';
          const isBottomPin = pin.side === 'BOTTOM' || pin.side === 'BOTH';
          const isVisible = (state.currentSide === 'TOP' && isTopPin && state.visibility.topPins) || 
                            (state.currentSide === 'BOTTOM' && isBottomPin && state.visibility.bottomPins);

          if (!isVisible) return;

          const dist = Math.hypot(pin.x - worldX, pin.y - worldY);
          if (dist < minDistance) {
            minDistance = dist;
            closestPin = { pin, node };
          }
        });
      });

      return closestPin;
    }

    function handleLeftClick(e) {
      const hit = getPinAtMouse(e.clientX, e.clientY);
      const infoBox = document.getElementById('infoBox');

      if (hit) {
        state.selectedPin = hit.pin;
        state.highlightedNode = null;
        
        document.getElementById('infoComp').innerText = hit.pin.component || 'N/A';
        document.getElementById('infoPinNum').innerText = hit.pin.pinNum || 'N/A';
        document.getElementById('infoNode').innerText = hit.node.name;
        document.getElementById('infoSide').innerText = hit.pin.side;
        document.getElementById('infoCoords').innerText = `X: ${hit.pin.x}, Y: ${hit.pin.y}`;
        
        const connectionsText = hit.node.pins.map(p => p.ref || 'Pin').join(', ');
        document.getElementById('infoConnections').innerText = `${hit.node.name} = [ ${connectionsText} ]`;
        
        infoBox.style.display = 'block';
        render();
      } else {
        infoBox.style.display = 'none';
        state.selectedPin = null;
        render();
      }
    }

    viewport.addEventListener('contextmenu', (e) => {
      e.preventDefault(); 
      const hit = getPinAtMouse(e.clientX, e.clientY);
      const infoBox = document.getElementById('infoBox');

      if (hit) {
        state.selectedPin = hit.pin;
        state.highlightedNode = hit.node; 

        document.getElementById('infoComp').innerText = hit.pin.component || 'N/A';
        document.getElementById('infoPinNum').innerText = hit.pin.pinNum || 'N/A';
        document.getElementById('infoNode').innerText = hit.node.name;
        document.getElementById('infoSide').innerText = hit.pin.side;
        document.getElementById('infoCoords').innerText = `X: ${hit.pin.x}, Y: ${hit.pin.y}`;

        const connectionsText = hit.node.pins.map(p => p.ref || 'Pin').join(', ');
        document.getElementById('infoConnections').innerText = `Connected Net:\n${hit.node.name} = [ ${connectionsText} ]`;

        infoBox.style.display = 'block';
        render();
      } else {
        state.highlightedNode = null;
        state.selectedPin = null;
        infoBox.style.display = 'none';
        render();
      }
    });

    document.getElementById('closeInfoBox').addEventListener('click', () => {
      document.getElementById('infoBox').style.display = 'none';
      state.selectedPin = null;
      state.highlightedNode = null;
      render();
    });

    viewport.addEventListener('mousedown', (e) => {
      if (e.button === 0) {
        state.isDragging = true;
        state.dragStart = { x: e.clientX - state.transform.x, y: e.clientY - state.transform.y };
        dragStartPos = { x: e.clientX, y: e.clientY };
      }
    });

    viewport.addEventListener('click', (e) => {
      const dist = Math.hypot(e.clientX - dragStartPos.x, e.clientY - dragStartPos.y);
      if (dist < 5) {
        handleLeftClick(e);
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (!state.isDragging) return;
      state.transform.x = e.clientX - state.dragStart.x;
      state.transform.y = e.clientY - state.dragStart.y;
      render();
    });

    window.addEventListener('mouseup', () => state.isDragging = false);

    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.15 : 0.85;

      const mouseX = e.clientX - viewport.offsetLeft;
      const mouseY = e.clientY - viewport.offsetTop;

      state.transform.x = mouseX - (mouseX - state.transform.x) * zoomFactor;
      state.transform.y = mouseY - (mouseY - state.transform.y) * zoomFactor;
      state.transform.scale *= zoomFactor;

      render();
    }, { passive: false });

    document.getElementById('btnTopView').addEventListener('click', () => {
      state.currentSide = 'TOP';
      document.getElementById('btnTopView').classList.add('active');
      document.getElementById('btnBottomView').classList.remove('active');
      render();
    });

    document.getElementById('btnBottomView').addEventListener('click', () => {
      state.currentSide = 'BOTTOM';
      document.getElementById('btnBottomView').classList.add('active');
      document.getElementById('btnTopView').classList.remove('active');
      render();
    });

    document.getElementById('chkTopPins').addEventListener('change', (e) => { state.visibility.topPins = e.target.checked; render(); });
    document.getElementById('chkBottomPins').addEventListener('change', (e) => { state.visibility.bottomPins = e.target.checked; render(); });
    document.getElementById('chkTopComp').addEventListener('change', (e) => { state.visibility.topComp = e.target.checked; render(); });
    document.getElementById('chkBottomComp').addEventListener('change', (e) => { state.visibility.bottomComp = e.target.checked; render(); });
    document.getElementById('chkBoardOutline').addEventListener('change', (e) => { state.visibility.boardOutline = e.target.checked; render(); });

    resizeCanvas();
  </script>
</body>
