<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agilent 3070 Board Graphic Viewer</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --panel-bg: rgba(30, 41, 59, 0.85);
      --border-color: #334155;
      --accent-color: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --top-color: #38bdf8;
      --bottom-color: #f43f5e;
      --outline-color: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar Navigation */
    #sidebar {
      width: 320px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 20px;
      z-index: 10;
      box-shadow: 4px 0 24px rgba(0,0,0,0.3);
      overflow-y: auto;
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--accent-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-box {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px;
    }

    .section-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 12px;
      font-weight: 600;
    }

    /* File Input Styling */
    .file-input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label.file-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      background: #1e293b;
      border: 1px dashed var(--accent-color);
      border-radius: 6px;
      color: var(--accent-color);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    label.file-btn:hover {
      background: rgba(56, 189, 248, 0.1);
    }

    input[type="file"] {
      display: none;
    }

    .file-status {
      font-size: 0.75rem;
      color: var(--text-muted);
      word-break: break-all;
    }

    /* Toggle Buttons */
    .view-toggle-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn {
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      background: #1e293b;
      color: var(--text-main);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .btn:hover {
      border-color: var(--accent-color);
    }

    .btn.active {
      background: var(--accent-color);
      color: #0f172a;
      border-color: var(--accent-color);
      font-weight: 700;
    }

    /* Feature Checkboxes */
    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-main);
    }

    .checkbox-item input {
      accent-color: var(--accent-color);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    /* Overview Map */
    #overview-container {
      position: relative;
      width: 100%;
      height: 180px;
      background: #090d16;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      overflow: hidden;
    }

    #overviewCanvas {
      width: 100%;
      height: 100%;
    }

    /* Main Viewer Viewport */
    #viewport {
      flex: 1;
      position: relative;
      background-color: #050811;
      cursor: grab;
      overflow: hidden;
    }

    #viewport:active {
      cursor: grabbing;
    }

    #mainCanvas {
      position: absolute;
      top: 0;
      left: 0;
    }

    /* Floating Stats Bar */
    .stats-bar {
      position: absolute;
      bottom: 16px;
      right: 16px;
      background: var(--panel-bg);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      gap: 16px;
      pointer-events: none;
    }

    .stats-bar span strong {
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <!-- Sidebar Controls -->
  <div id="sidebar">
    <div class="brand-title">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="2" width="20" height="20" rx="4"></rect>
        <circle cx="8" cy="8" r="2"></circle>
        <circle cx="16" cy="16" r="2"></circle>
        <path d="M8 10v4h8"></path>
      </svg>
      Agilent 3070 Viewer
    </div>

    <!-- File Input Section -->
    <div class="section-box">
      <div class="section-title">Load Board File(s)</div>
      <div class="file-input-group">
        <label class="file-btn">
          Select File 1 (or Full File)
          <input type="file" id="fileInput1" accept=".file,.xy,.txt,*">
        </label>
        <div class="file-status" id="file1Status">No file selected</div>

        <label class="file-btn" style="margin-top: 6px;">
          Select File 2 (Optional)
          <input type="file" id="fileInput2" accept=".file,.xy,.txt,*">
        </label>
        <div class="file-status" id="file2Status">No file selected</div>
      </div>
    </div>

    <!-- View Mode Toggle -->
    <div class="section-box">
      <div class="section-title">Board Side View</div>
      <div class="view-toggle-group">
        <button class="btn active" id="btnTopView">Top Side</button>
        <button class="btn" id="btnBottomView">Bottom Side</button>
      </div>
    </div>

    <!-- Feature Display Filters -->
    <div class="section-box">
      <div class="section-title">Feature Visibility</div>
      <div class="checkbox-group">
        <label class="checkbox-item">
          <span>Top Pins</span>
          <input type="checkbox" id="chkTopPins" checked>
        </label>
        <label class="checkbox-item">
          <span>Bottom Pins</span>
          <input type="checkbox" id="chkBottomPins" checked>
        </label>
        <hr style="border-color: var(--border-color); margin: 2px 0;">
        <label class="checkbox-item">
          <span>Top Component Outline</span>
          <input type="checkbox" id="chkTopComp" checked>
        </label>
        <label class="checkbox-item">
          <span>Bottom Component Outline</span>
          <input type="checkbox" id="chkBottomComp" checked>
        </label>
        <hr style="border-color: var(--border-color); margin: 2px 0;">
        <label class="checkbox-item">
          <span>Board Outline</span>
          <input type="checkbox" id="chkBoardOutline" checked>
        </label>
      </div>
    </div>

    <!-- Overview Minimap -->
    <div class="section-box">
      <div class="section-title">Overview Map</div>
      <div id="overview-container">
        <canvas id="overviewCanvas"></canvas>
      </div>
    </div>
  </div>

  <!-- Main Viewport Canvas -->
  <div id="viewport">
    <canvas id="mainCanvas"></canvas>
    
    <div class="stats-bar">
      <div>Nodes: <strong id="statNodes">0</strong></div>
      <div>Components/Pins: <strong id="statPins">0</strong></div>
      <div>Zoom: <strong id="statZoom">100%</strong></div>
    </div>
  </div>

  <script>
    // State management
    const state = {
      file1Text: '',
      file2Text: '',
      nodes: [],
      outlines: [], // Holds actual board outline primitives
      currentSide: 'TOP', // 'TOP' or 'BOTTOM'
      visibility: {
        topPins: true,
        bottomPins: true,
        topComp: true,
        bottomComp: true,
        boardOutline: true
      },
      bounds: { minX: 0, maxX: 1000, minY: 0, maxY: 1000 },
      transform: { x: 0, y: 0, scale: 1 },
      isDragging: false,
      dragStart: { x: 0, y: 0 }
    };

    // Canvas contexts
    const viewport = document.getElementById('viewport');
    const mainCanvas = document.getElementById('mainCanvas');
    const mainCtx = mainCanvas.getContext('2d');
    const overviewCanvas = document.getElementById('overviewCanvas');
    const overviewCtx = overviewCanvas.getContext('2d');

    // Initialize dimensions
    function resizeCanvas() {
      mainCanvas.width = viewport.clientWidth;
      mainCanvas.height = viewport.clientHeight;
      overviewCanvas.width = overviewCanvas.parentElement.clientWidth;
      overviewCanvas.height = overviewCanvas.parentElement.clientHeight;
      render();
    }
    window.addEventListener('resize', resizeCanvas);

    // Parse Agilent 3070 board_xy file content
    function parseBoardXY(text) {
      const nodes = [];
      const outlines = [];
      const lines = text.split('\n');
      let currentNode = null;
      let inOutlineSection = false;
      let currentPrimitive = [];

      for (let line of lines) {
        line = line.trim();
        if (!line) continue;

        // Parse Outline / Primitives section
        if (line.includes('PRIMITIVE') || line.includes('OUTLINE') || line.includes('BORDER')) {
          inOutlineSection = true;
          currentNode = null;
          continue;
        }

        if (line.startsWith('NODE')) {
          inOutlineSection = false;
          const parts = line.split(/\s+/);
          currentNode = {
            name: parts[1] || 'UNKNOWN',
            pins: []
          };
          nodes.push(currentNode);
        } else if (inOutlineSection) {
          // Parse outline coordinates: e.g. "1000, 2000; 3000, 2000;" or "POLY ... "
          const outlineCoords = [...line.matchAll(/(-?\d+),\s*(-?\d+)/g)];
          if (outlineCoords.length > 0) {
            const path = outlineCoords.map(m => ({ x: parseInt(m[1], 10), y: parseInt(m[2], 10) }));
            outlines.push(path);
          }
        } else if (currentNode) {
          // Parse pin coordinates: e.g. "190, 3050 J3.1 TOP NO_PROBE;"
          const coordMatch = line.match(/(-?\d+),\s*(-?\d+)\s*([^;]*)/);
          if (coordMatch) {
            const x = parseInt(coordMatch[1], 10);
            const y = parseInt(coordMatch[2], 10);
            const meta = coordMatch[3] || '';
            const isTop = meta.includes('TOP');
            const isBottom = meta.includes('BOTTOM');
            
            // Extract Component Tag if available (e.g., J3.1)
            const compMatch = meta.match(/([A-Z0-9]+\.[A-Z0-9]+)/i);
            const compRef = compMatch ? compMatch[1] : '';

            currentNode.pins.push({
              x,
              y,
              side: isBottom ? 'BOTTOM' : 'TOP',
              ref: compRef,
              rawMeta: meta
            });
          }
        }
      }
      return { nodes, outlines };
    }

    function calculateBounds(nodes, outlines) {
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      let pinCount = 0;

      nodes.forEach(node => {
        node.pins.forEach(pin => {
          pinCount++;
          if (pin.x < minX) minX = pin.x;
          if (pin.x > maxX) maxX = pin.x;
          if (pin.y < minY) minY = pin.y;
          if (pin.y > maxY) maxY = pin.y;
        });
      });

      outlines.forEach(path => {
        path.forEach(pt => {
          if (pt.x < minX) minX = pt.x;
          if (pt.x > maxX) maxX = pt.x;
          if (pt.y < minY) minY = pt.y;
          if (pt.y > maxY) maxY = pt.y;
        });
      });

      if (minX === Infinity) {
        minX = 0; maxX = 50000; minY = -10000; maxY = 30000;
      }

      state.bounds = { minX, maxX, minY, maxY };
      document.getElementById('statNodes').innerText = nodes.length;
      document.getElementById('statPins').innerText = pinCount;

      resetView();
    }

    function resetView() {
      const margin = 40;
      const boardWidth = state.bounds.maxX - state.bounds.minX;
      const boardHeight = state.bounds.maxY - state.bounds.minY;

      if (boardWidth <= 0 || boardHeight <= 0) return;

      const scaleX = (mainCanvas.width - margin * 2) / boardWidth;
      const scaleY = (mainCanvas.height - margin * 2) / boardHeight;
      state.transform.scale = Math.min(scaleX, scaleY);

      state.transform.x = margin + (mainCanvas.width - margin * 2 - boardWidth * state.transform.scale) / 2 - state.bounds.minX * state.transform.scale;
      state.transform.y = margin + (mainCanvas.height - margin * 2 - boardHeight * state.transform.scale) / 2 - state.bounds.minY * state.transform.scale;
      
      render();
    }

    // Process files
    function processFiles() {
      const combinedText = state.file1Text + '\n' + state.file2Text;
      const parsed = parseBoardXY(combinedText);
      state.nodes = parsed.nodes;
      state.outlines = parsed.outlines;
      calculateBounds(state.nodes, state.outlines);
    }

    document.getElementById('fileInput1').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      document.getElementById('file1Status').innerText = file.name;
      const reader = new FileReader();
      reader.onload = (evt) => {
        state.file1Text = evt.target.result;
        processFiles();
      };
      reader.readAsText(file);
    });

    document.getElementById('fileInput2').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      document.getElementById('file2Status').innerText = file.name;
      const reader = new FileReader();
      reader.onload = (evt) => {
        state.file2Text = evt.target.result;
        processFiles();
      };
      reader.readAsText(file);
    });

    // Render Canvas
    function render() {
      mainCtx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
      document.getElementById('statZoom').innerText = Math.round(state.transform.scale * 10000) / 100 + '%';

      // Draw Grid Background
      drawGrid(mainCtx, mainCanvas.width, mainCanvas.height);

      mainCtx.save();
      // Apply panning and zooming transform
      mainCtx.translate(state.transform.x, state.transform.y);

      // Mirror Vertically when in Bottom View (Agilent 3070 Standard)
      const flipY = (state.currentSide === 'BOTTOM') ? 1 : -1;
      if (state.currentSide === 'BOTTOM') {
        const centerY = (state.bounds.minY + state.bounds.maxY) / 2;
        mainCtx.translate(0, centerY * state.transform.scale);
        mainCtx.scale(state.transform.scale, flipY * state.transform.scale);
        mainCtx.translate(0, -centerY);
      } else {
        mainCtx.scale(state.transform.scale, flipY * state.transform.scale);
      }

      // 1. True Board Outline Drawing from PRIMITIVE
      if (state.visibility.boardOutline) {
        mainCtx.strokeStyle = '#10b981';
        mainCtx.lineWidth = 2 / state.transform.scale;

        if (state.outlines.length > 0) {
          state.outlines.forEach(path => {
            if (path.length < 2) return;
            mainCtx.beginPath();
            mainCtx.moveTo(path[0].x, path[0].y);
            for (let i = 1; i < path.length; i++) {
              mainCtx.lineTo(path[i].x, path[i].y);
            }
            mainCtx.stroke();
          });
        } else {
          // Fallback box outline if no PRIMITIVE outline block present
          const b = state.bounds;
          mainCtx.strokeRect(b.minX - 500, b.minY - 500, (b.maxX - b.minX) + 1000, (b.maxY - b.minY) + 1000);
        }
      }

      // 2. Pins & Component Representations
      state.nodes.forEach(node => {
        node.pins.forEach(pin => {
          const isTopPin = pin.side === 'TOP';
          const isBottomPin = pin.side === 'BOTTOM';

          // Independent Pin Visibility checks
          if (isTopPin && !state.visibility.topPins) return;
          if (isBottomPin && !state.visibility.bottomPins) return;

          // Draw Pin Point (Top Pin = Blue, Bottom Pin = Red ALWAYS)
          mainCtx.beginPath();
          mainCtx.arc(pin.x, pin.y, 120, 0, Math.PI * 2);
          if (isTopPin) {
            mainCtx.fillStyle = '#38bdf8'; // Blue
          } else {
            mainCtx.fillStyle = '#f43f5e'; // Red
          }
          mainCtx.fill();

          // Component Outline simulation
          if (pin.ref) {
            const showTopComp = isTopPin && state.visibility.topComp;
            const showBottomComp = isBottomPin && state.visibility.bottomComp;

            if (showTopComp || showBottomComp) {
              mainCtx.strokeStyle = showTopComp ? 'rgba(56, 189, 248, 0.4)' : 'rgba(244, 63, 94, 0.4)';
              mainCtx.lineWidth = 1 / state.transform.scale;
              mainCtx.strokeRect(pin.x - 200, pin.y - 200, 400, 400);
            }
          }
        });
      });

      mainCtx.restore();

      // Render Overview Map
      renderOverview();
    }

    function drawGrid(ctx, width, height) {
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 1;
      const gridSize = 40;
      ctx.beginPath();
      for (let x = 0; x < width; x += gridSize) {
        ctx.moveTo(x, 0); ctx.lineTo(x, height);
      }
      for (let y = 0; y < height; y += gridSize) {
        ctx.moveTo(0, y); ctx.lineTo(width, y);
      }
      ctx.stroke();
    }

    // Render Overview Map & Viewport Location Box
    function renderOverview() {
      const w = overviewCanvas.width;
      const h = overviewCanvas.height;
      overviewCtx.clearRect(0, 0, w, h);

      const b = state.bounds;
      const boardW = b.maxX - b.minX + 2000;
      const boardH = b.maxY - b.minY + 2000;

      if (boardW <= 0 || boardH <= 0) return;

      const scale = Math.min(w / boardW, h / boardH);
      const offsetX = (w - boardW * scale) / 2;
      const offsetY = (h - boardH * scale) / 2;

      // Draw Mini Board
      overviewCtx.strokeStyle = '#334155';
      overviewCtx.strokeRect(offsetX, offsetY, boardW * scale, boardH * scale);

      // Draw Pins on Mini Map
      state.nodes.forEach(node => {
        node.pins.forEach(pin => {
          const mx = offsetX + (pin.x - b.minX + 1000) * scale;
          const my = h - (offsetY + (pin.y - b.minY + 1000) * scale);
          overviewCtx.fillStyle = (pin.side === 'TOP') ? '#38bdf8' : '#f43f5e';
          overviewCtx.fillRect(mx, my, 1.5, 1.5);
        });
      });

      // Draw Viewport Box
      const vpLeft = (-state.transform.x - b.minX + 1000) * (scale / state.transform.scale) + offsetX;
      const vpTop = (-state.transform.y - b.minY + 1000) * (scale / state.transform.scale) + offsetY;
      const vpW = mainCanvas.width * (scale / state.transform.scale);
      const vpH = mainCanvas.height * (scale / state.transform.scale);

      overviewCtx.strokeStyle = '#f59e0b';
      overviewCtx.lineWidth = 1.5;
      overviewCtx.strokeRect(vpLeft, vpTop, vpW, vpH);
      overviewCtx.fillStyle = 'rgba(245, 158, 11, 0.15)';
      overviewCtx.fillRect(vpLeft, vpTop, vpW, vpH);
    }

    // Mouse Interaction (Pan & Zoom)
    viewport.addEventListener('mousedown', (e) => {
      state.isDragging = true;
      state.dragStart = { x: e.clientX - state.transform.x, y: e.clientY - state.transform.y };
    });

    window.addEventListener('mousemove', (e) => {
      if (!state.isDragging) return;
      state.transform.x = e.clientX - state.dragStart.x;
      state.transform.y = e.clientY - state.dragStart.y;
      render();
    });

    window.addEventListener('mouseup', () => state.isDragging = false);

    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.15 : 0.85;

      const mouseX = e.clientX - viewport.offsetLeft;
      const mouseY = e.clientY - viewport.offsetTop;

      state.transform.x = mouseX - (mouseX - state.transform.x) * zoomFactor;
      state.transform.y = mouseY - (mouseY - state.transform.y) * zoomFactor;
      state.transform.scale *= zoomFactor;

      render();
    }, { passive: false });

    // UI Event Listeners for View Toggle & Features
    document.getElementById('btnTopView').addEventListener('click', (e) => {
      state.currentSide = 'TOP';
      document.getElementById('btnTopView').classList.add('active');
      document.getElementById('btnBottomView').classList.remove('active');
      render();
    });

    document.getElementById('btnBottomView').addEventListener('click', (e) => {
      state.currentSide = 'BOTTOM';
      document.getElementById('btnBottomView').classList.add('active');
      document.getElementById('btnTopView').classList.remove('active');
      render();
    });

    document.getElementById('chkTopPins').addEventListener('change', (e) => { state.visibility.topPins = e.target.checked; render(); });
    document.getElementById('chkBottomPins').addEventListener('change', (e) => { state.visibility.bottomPins = e.target.checked; render(); });
    document.getElementById('chkTopComp').addEventListener('change', (e) => { state.visibility.topComp = e.target.checked; render(); });
    document.getElementById('chkBottomComp').addEventListener('change', (e) => { state.visibility.bottomComp = e.target.checked; render(); });
    document.getElementById('chkBoardOutline').addEventListener('change', (e) => { state.visibility.boardOutline = e.target.checked; render(); });

    // Initial Layout Setup
    resizeCanvas();
  </script>
</body>
</html>
