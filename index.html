<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agilent Board_XY Graphic Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: #fff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            height: 95vh;
        }
        #controls {
            margin-bottom: 10px;
            background: #2d2d2d;
            padding: 10px 15px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            font-size: 14px;
        }
        #viewer-container {
            flex: 1;
            background-color: #000;
            border: 2px solid #444;
            position: relative;
            overflow: hidden;
            border-radius: 6px;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: crosshair;
        }
        label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
        }
        select, button {
            background: #3a3a3a;
            color: #fff;
            border: 1px solid #555;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
        select:hover, button:hover {
            background: #4a4a4a;
        }
        .box {
            width: 12px;
            height: 12px;
            display: inline-block;
            border: 1px solid #fff;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <h2>Agilent Board_XY Graphic Viewer</h2>
    
    <div id="controls">
        <input type="file" id="fileInput" accept=".txt,.xy,.board_xy,text/*">
        
        <!-- View Mode Selector -->
        <div>
            <label for="viewMode" style="display:inline;">View: </label>
            <select id="viewMode">
                <option value="top">Top View</option>
                <option value="bottom">Bottom View (Mirrored)</option>
            </select>
        </div>

        <!-- Layer Checkboxes -->
        <label>
            <input type="checkbox" id="chkOutline" checked>
            <span class="box" style="background: #ff007f;"></span> Board Outline
        </label>
        
        <label>
            <input type="checkbox" id="chkTop" checked>
            <span class="box" style="background: #00ffff;"></span> Top Side
        </label>
        
        <label>
            <input type="checkbox" id="chkBottom" checked>
            <span class="box" style="background: #ffb700;"></span> Bottom Side
        </label>

        <button onclick="resetZoom()">Reset Zoom</button>
    </div>

    <div id="viewer-container">
        <canvas id="boardCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('boardCanvas');
        const ctx = canvas.getContext('2d');
        const fileInput = document.getElementById('fileInput');

        // UI Controls
        const chkOutline = document.getElementById('chkOutline');
        const chkTop = document.getElementById('chkTop');
        const chkBottom = document.getElementById('chkBottom');
        const viewModeSelect = document.getElementById('viewMode');

        let boardData = { outline: [], points: [] };
        let boardCenterX = 0;
        let scale = 1;
        let panX = 0;
        let panY = 0;
        let isDragging = false;
        let startX, startY;

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            draw();
        }
        window.addEventListener('resize', resizeCanvas);

        // Event Listeners for Controls
        [chkOutline, chkTop, chkBottom, viewModeSelect].forEach(el => {
            el.addEventListener('change', draw);
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                parseBoardXY(event.target.result);
                calculateCenter();
                resetZoom();
            };
            reader.readAsText(file);
        });

        function parseBoardXY(text) {
            boardData = { outline: [], points: [] };
            const lines = text.split('\n');
            let inOutline = false;

            for (let rawLine of lines) {
                let line = rawLine.trim();
                if (!line || line.startsWith('!') || line.startsWith('//')) continue;

                if (line.includes('BOARD OUTLINE') || line.includes('OUTLINE')) {
                    inOutline = true;
                    continue;
                }

                if (inOutline) {
                    if (line.includes('END') || line.includes('NODE')) {
                        inOutline = false;
                    } else {
                        const coords = line.match(/(-?\d+)\s*,\s*(-?\d+)/);
                        if (coords) {
                            boardData.outline.push({ x: parseInt(coords[1]), y: parseInt(coords[2]) });
                        }
                    }
                }

                const nodeMatch = line.match(/(-?\d+)\s*,\s*(-?\d+)\s+([\w%\.]+)\s+(TOP|BOTTOM)/i);
                if (nodeMatch) {
                    boardData.points.push({
                        x: parseInt(nodeMatch[1]),
                        y: parseInt(nodeMatch[2]),
                        name: nodeMatch[3],
                        side: nodeMatch[4].toUpperCase()
                    });
                }
            }
        }

        function calculateCenter() {
            let allX = [...boardData.outline.map(p => p.x), ...boardData.points.map(p => p.x)];
            if (allX.length > 0) {
                let minX = Math.min(...allX);
                let maxX = Math.max(...allX);
                boardCenterX = (minX + maxX) / 2;
            } else {
                boardCenterX = 0;
            }
        }

        function getTransformedX(x) {
            // Horizontal mirror when in Bottom View
            return (viewModeSelect.value === 'bottom') ? (2 * boardCenterX - x) : x;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(panX, panY);
            ctx.scale(scale, scale);

            // 1. Draw Board Outline
            if (chkOutline.checked && boardData.outline.length > 0) {
                ctx.strokeStyle = '#ff007f';
                ctx.lineWidth = 2 / scale;
                ctx.beginPath();
                
                let startX = getTransformedX(boardData.outline[0].x);
                ctx.moveTo(startX, -boardData.outline[0].y);

                for (let i = 1; i < boardData.outline.length; i++) {
                    let curX = getTransformedX(boardData.outline[i].x);
                    ctx.lineTo(curX, -boardData.outline[i].y);
                }
                ctx.closePath();
                ctx.stroke();
            }

            // 2. Draw Nodes / Pins
            const pointSize = Math.max(2, 8 / scale);
            for (let pt of boardData.points) {
                if (pt.side === 'TOP' && !chkTop.checked) continue;
                if (pt.side === 'BOTTOM' && !chkBottom.checked) continue;

                ctx.fillStyle = (pt.side === 'TOP') ? '#00ffff' : '#ffb700';
                let renderX = getTransformedX(pt.x);
                ctx.fillRect(renderX - pointSize / 2, -pt.y - pointSize / 2, pointSize, pointSize);
            }

            ctx.restore();
        }

        function resetZoom() {
            if (boardData.points.length === 0 && boardData.outline.length === 0) return;

            let allX = [...boardData.outline.map(p => p.x), ...boardData.points.map(p => p.x)];
            let allY = [...boardData.outline.map(p => -p.y), ...boardData.points.map(p => -p.y)];

            let minX = Math.min(...allX);
            let maxX = Math.max(...allX);
            let minY = Math.min(...allY);
            let maxY = Math.max(...allY);

            let width = maxX - minX || 1;
            let height = maxY - minY || 1;

            scale = Math.min(canvas.width / width, canvas.height / height) * 0.8;
            panX = (canvas.width - width * scale) / 2 - minX * scale;
            panY = (canvas.height - height * scale) / 2 - minY * scale;

            draw();
        }

        // Mouse Pan and Zoom
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - panX;
            startY = e.clientY - panY;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                panX = e.clientX - startX;
                panY = e.clientY - startY;
                draw();
            }
        });

        canvas.addEventListener('mouseup', () => isDragging = false);

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = e.deltaY < 0 ? 1.15 : 0.85;
            scale *= zoomFactor;
            draw();
        });

        resizeCanvas();
    </script>
</body>
</html>
